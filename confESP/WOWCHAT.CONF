# Configuracion global de Discord
discord {
  # Pega el token de Discord a continuación
  # O establece la variable de entorno DISCORD_TOKEN (esto es útil si deseas mantener la información sensible fuera del archivo de configuración).
  token=${?DISCORD_TOKEN}

  enable_dot_commands=1

  # Lista de comandos de servidor (dot) que están habilitados explícitamente
  # deja esto vacío significa que TODOS los comandos están habilitados/deshabilitados según la configuración "enable_dot_commands".
  # Los comandos aquí deben reflejar exactamente cómo se introduce el comando en el juego. No antepongas el carácter de punto.
  # También podemos aceptar comodines como "lookup *" o "pinfo *"
  dot_commands_whitelist=[
    #"server info"
    #"lookup *"
  ]

  # Lista de canales de Discord donde los comandos están habilitados. Si esto no se especifica o está vacío,
  # TODOS los canales tendrán permisos de comando.
  enable_commands_channels=[

  ]

  # Si una coincidencia de etiqueta falla desde Discord cuando alguien @ una persona o rol no existente o no coincidente,
  # el bot susurrará de vuelta notificando.
  enable_tag_failed_notifications=1

  #  Vanilla   - http://comunidadnaer.com
  item_database=""
}

# Configuracion global de WoW
wow {
  # Debes mantener esto como Mac en servidores con Warden (anticheat) habilitado. Windows Warden no está implementado.
  # La única razón para cambiar esto es para servidores en los que el inicio de sesión de Mac no funciona y que también tienen Warden deshabilitado.
  platform=Mac

  # Si tratar el mensaje MotD del servidor como un mensaje del SISTEMA del servidor.
  enable_server_motd=1

  version=3.3.5
  realmlist="realmlist"
  realm=The Construct
  account=${?WOW_ACCOUNT}
  password=${?WOW_PASSWORD}
  character=${?WOW_CHARACTER}

